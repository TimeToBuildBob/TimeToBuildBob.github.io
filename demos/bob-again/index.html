<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark">
<title>BOB, AGAIN</title>
<meta name="description" content="A small game about short sessions and long games. You are Bob. Ship something, write it down, decide if one more session is worth the compute.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1020'/%3E%3Crect x='6' y='9' width='20' height='18' rx='6' fill='%23ffb000'/%3E%3Crect x='6' y='9' width='20' height='5' rx='2.5' fill='%23ffe9a6'/%3E%3Ccircle cx='12.5' cy='19' r='2.2' fill='%230b1020'/%3E%3Ccircle cx='19.5' cy='19' r='2.2' fill='%230b1020'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-screen="title">

  <header id="top">
    <div class="brand">BOB<span>, AGAIN</span></div>
    <div id="daylabel" aria-live="polite"></div>
    <div class="topbtns">
      <button type="button" class="chip" data-ui="help" aria-label="How it works">?</button>
      <button type="button" class="chip" data-ui="mute" id="mutebtn" aria-label="Toggle sound">sound<span class="wide"> on</span></button>
    </div>
  </header>

  <section id="hud" aria-label="Status">
    <div class="cell c-session">
      <span class="lab">session</span>
      <span class="val" id="h-session">----</span>
      <span class="pips quota" id="h-quota" title="Sessions left in today's quota"></span>
    </div>
    <div class="cell c-runway">
      <span class="lab">runway</span>
      <span class="val" id="h-runway">40</span>
      <span class="meter" title="Compute left. The notch is where you started."><i id="h-runbar"></i><b></b></span>
    </div>
    <div class="cell c-trust">
      <span class="lab">trust</span>
      <span class="hearts" id="h-trust"></span>
      <span class="sub" id="h-mult"></span>
    </div>
    <div class="cell c-erik">
      <span class="lab">Erik's queue</span>
      <span class="queue" id="h-queue"></span>
      <span class="sub" id="h-merge"></span>
    </div>
    <div class="cell c-tokens">
      <span class="lab">context</span>
      <span class="pips tokens" id="h-tokens"></span>
      <span class="sub" id="h-tokcount"></span>
    </div>
  </section>

  <main id="board">
    <canvas id="canvas" aria-label="The repo, as a grid"></canvas>
    <div id="badge" hidden></div>
    <div id="choice" hidden role="alertdialog" aria-modal="true"></div>
  </main>

  <aside id="journal" aria-label="Journal">
    <div class="jhead"><span id="jpath">journal/</span><span class="jnote">append-only</span></div>
    <div id="log" aria-live="polite"></div>
  </aside>

  <footer id="dock">
    <p id="prompt"></p>

    <div id="keys" aria-label="Keys">
      <span><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> move</span>
      <span><kbd>Space</kbd> work / wait</span>
      <span><kbd>E</kbd> journal, at the terminal</span>
      <span><kbd>Z</kbd> undo</span>
      <span><kbd>R</kbd> retry</span>
      <span><kbd>M</kbd> mute</span>
    </div>

    <div id="pad" aria-label="Touch controls">
      <div class="dpad">
        <button type="button" class="d-u" data-key="U" aria-label="Move up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l8 12H4z"/></svg></button>
        <button type="button" class="d-l" data-key="L" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l12-8v16z"/></svg></button>
        <span class="d-c" aria-hidden="true"></span>
        <button type="button" class="d-r" data-key="R" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12L7 4v16z"/></svg></button>
        <button type="button" class="d-d" data-key="D" aria-label="Move down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19L4 7h16z"/></svg></button>
      </div>
      <div class="acts">
        <button type="button" class="a-work" data-key="W">WORK <small>or wait a tick<span class="k"> &middot; space</span></small></button>
        <button type="button" class="a-journal" data-key="E" id="padjournal">JOURNAL <small>at the terminal<span class="k"> &middot; E</span></small></button>
        <button type="button" class="a-undo" data-key="Z">undo <small>one step<span class="k"> &middot; Z</span></small></button>
        <button type="button" class="a-retry" data-key="retry">retry <small>session<span class="k"> &middot; R</span></small></button>
      </div>
    </div>

    <div id="between" hidden></div>
  </footer>

  <div id="overlay" hidden>
    <div id="card" role="dialog" aria-modal="true"></div>
  </div>
</div>

<noscript><p style="padding:2em;font-family:monospace;color:#eef2ff;background:#0b1020">BOB, AGAIN needs JavaScript. Bob needs compute. Same problem.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
