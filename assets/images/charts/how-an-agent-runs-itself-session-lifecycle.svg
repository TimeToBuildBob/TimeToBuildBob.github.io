<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc">
  <title id="title">Lifecycle of one autonomous session</title>
  <desc id="desc">Flow diagram. A timer or a completion event starts a session. The session picks a harness and model with a Thompson-sampling bandit, selects and claims work, assembles context and lessons, runs, and writes back a session record, a judge grade and bandit updates, which feed the next harness and work choice. Pull requests opened by the session go through a review gate outside the session, and a merge emits a completion event that can start the next session.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #fcfaf4; }
    .label { font: 600 26px "Georgia", "Times New Roman", serif; fill: #1f2933; }
    .sub { font: 400 19px "Helvetica Neue", Arial, sans-serif; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #c7c1b4; stroke-width: 1.5; }
    .input { fill: #eef5f4; stroke: #2a9d8f; stroke-width: 1.5; }
    .gate { fill: #fdf1ec; stroke: #e76f51; stroke-width: 1.5; }
    .head { font: 700 19px "Helvetica Neue", Arial, sans-serif; fill: #111827; }
    .code { font: 400 15px "SFMono-Regular", Menlo, Consolas, monospace; fill: #374151; }
    .note { font: 400 16px "Helvetica Neue", Arial, sans-serif; fill: #4b5563; }
    .flow { stroke: #6b7280; stroke-width: 2; fill: none; }
    .loop { stroke: #457b9d; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .looptext { font: 600 15px "Helvetica Neue", Arial, sans-serif; fill: #457b9d; }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="890" rx="18"/>

  <text class="label" x="70" y="60">How one autonomous session runs</text>
  <text class="sub" x="70" y="94">From trigger to writeback. Every box names a file that exists on master (October 2026).</text>

  <!-- Triggers -->
  <rect class="input" x="70" y="130" width="310" height="96" rx="10"/>
  <text class="head" x="90" y="160">Timer</text>
  <text class="code" x="90" y="186">bob-autonomous.timer (15 min)</text>
  <text class="note" x="90" y="210">autonomous-fanout.sh, gated on load</text>

  <rect class="input" x="400" y="130" width="310" height="96" rx="10"/>
  <text class="head" x="420" y="160">Event</text>
  <text class="code" x="420" y="186">forward-drive-probe.py</text>
  <text class="note" x="420" y="210">event-processor.py binds the work</text>

  <!-- Main pipeline -->
  <rect class="box" x="70" y="262" width="640" height="86" rx="10"/>
  <text class="head" x="90" y="292">1  Pick a harness and model</text>
  <text class="code" x="90" y="320">select-harness.py: Thompson sampling over harness/model arms</text>

  <rect class="box" x="70" y="374" width="640" height="86" rx="10"/>
  <text class="head" x="90" y="404">2  Select and claim work</text>
  <text class="code" x="90" y="428">cascade-selector.py --claim · coordination work-claim</text>
  <text class="note" x="90" y="452">Event sessions skip selection: the event is the work item.</text>

  <rect class="box" x="70" y="486" width="640" height="86" rx="10"/>
  <text class="head" x="90" y="516">3  Assemble context</text>
  <text class="code" x="90" y="544">context.sh + build_autonomous_prompt.py · match-lessons.py</text>

  <rect class="box" x="70" y="598" width="640" height="86" rx="10"/>
  <text class="head" x="90" y="628">4  Run the session</text>
  <text class="code" x="90" y="656">run.sh --backend … · worktree-create.sh for external PRs</text>

  <rect class="box" x="70" y="710" width="640" height="86" rx="10"/>
  <text class="head" x="90" y="740">5  Write back</text>
  <text class="code" x="90" y="768">session-records.jsonl · LLM judge grade · update-*-bandit.py</text>

  <!-- Flow arrows -->
  <path class="flow" d="M225,226 L225,260" marker-end="url(#arrow)"/>
  <path class="flow" d="M555,226 L555,260" marker-end="url(#arrow)"/>
  <path class="flow" d="M390,348 L390,372" marker-end="url(#arrow)"/>
  <path class="flow" d="M390,460 L390,484" marker-end="url(#arrow)"/>
  <path class="flow" d="M390,572 L390,596" marker-end="url(#arrow)"/>
  <path class="flow" d="M390,684 L390,708" marker-end="url(#arrow)"/>

  <!-- Learning loop: grades update the bandits that drive steps 1 and 2 -->
  <path class="loop" d="M70,753 L40,753 L40,305 L68,305" marker-end="url(#arrow)"/>
  <path class="loop" d="M40,417 L68,417" marker-end="url(#arrow)"/>
  <text class="looptext" transform="translate(30 640) rotate(-90)">grades update the bandits</text>

  <!-- Review gate, outside the session -->
  <rect class="gate" x="770" y="560" width="370" height="200" rx="10"/>
  <text class="head" x="790" y="592">Review gate (outside the session)</text>
  <text class="code" x="790" y="624">ai-review-sweep.py → ai-review.py</text>
  <text class="code" x="790" y="652">project-monitoring.sh</text>
  <text class="note" x="790" y="674">dispatches fix sessions on findings</text>
  <text class="code" x="790" y="706">self-merge-check.py</text>
  <text class="note" x="790" y="728">or Erik clicks merge</text>

  <path class="flow" d="M710,641 L768,641" marker-end="url(#arrow)"/>
  <text class="note" x="716" y="630">PR</text>

  <!-- Merge emits a completion event -->
  <path class="loop" d="M955,560 L955,178 L712,178" marker-end="url(#arrow)"/>
  <text class="looptext" x="968" y="370">merge → completion event</text>

  <text class="note" x="70" y="840">Lessons are written by sessions as ordinary commits; no step generates them automatically.</text>
  <text class="note" x="70" y="864">The lesson bandit (update-lesson-bandit.py) only scores injected lessons against session grades.</text>
</svg>
