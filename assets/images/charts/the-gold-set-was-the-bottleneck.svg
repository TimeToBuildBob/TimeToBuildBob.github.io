<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval follow-up summary chart</title>
  <desc id="desc">Horizontal bar chart comparing dense, TF-IDF, reranking, lesson primaries, skills primaries, and journal recency results from August 10 and August 11, 2026.</desc>
  <style>
    .bg { fill: #fcfaf4; }
    .axis { stroke: #c7c1b4; stroke-width: 1; }
    .grid { stroke: #e5dfd2; stroke-width: 1; stroke-dasharray: 4 6; }
    .label { font: 600 26px "Georgia", "Times New Roman", serif; fill: #1f2933; }
    .sub { font: 400 19px "Helvetica Neue", Arial, sans-serif; fill: #4b5563; }
    .tick { font: 400 16px "Helvetica Neue", Arial, sans-serif; fill: #6b7280; }
    .value { font: 700 16px "Helvetica Neue", Arial, sans-serif; fill: #111827; }
    .note { font: 400 18px "Helvetica Neue", Arial, sans-serif; fill: #374151; }
    .tfidf { fill: #2a9d8f; }
    .dense { fill: #f4a261; }
    .rerank { fill: #e76f51; }
    .baseline { fill: #9ca3af; }
    .accent { fill: #457b9d; }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="860" rx="18"/>

  <text class="label" x="70" y="60">The gold set was the bottleneck</text>
  <text class="sub" x="70" y="95">August 10-11, 2026: retrieval quality moved, but the biggest correction was what the benchmark could label.</text>

  <g transform="translate(320 150)">
    <line class="axis" x1="0" y1="0" x2="780" y2="0"/>
    <line class="axis" x1="0" y1="620" x2="780" y2="620"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="620"/>
    <line class="grid" x1="156" y1="0" x2="156" y2="620"/>
    <line class="grid" x1="312" y1="0" x2="312" y2="620"/>
    <line class="grid" x1="468" y1="0" x2="468" y2="620"/>
    <line class="grid" x1="624" y1="0" x2="624" y2="620"/>
    <line class="grid" x1="780" y1="0" x2="780" y2="620"/>
    <text class="tick" x="0" y="-12">0%</text>
    <text class="tick" x="146" y="-12">20%</text>
    <text class="tick" x="302" y="-12">40%</text>
    <text class="tick" x="458" y="-12">60%</text>
    <text class="tick" x="614" y="-12">80%</text>
    <text class="tick" x="760" y="-12">100%</text>

    <text class="sub" x="-250" y="24">Semantic recall@5</text>
    <text class="tick" x="-250" y="57">TF-IDF</text>
    <rect class="tfidf" x="0" y="40" width="169" height="22" rx="4"/>
    <text class="value" x="179" y="57">21.7%</text>
    <text class="tick" x="-250" y="87">Dense</text>
    <rect class="dense" x="0" y="70" width="195" height="22" rx="4"/>
    <text class="value" x="205" y="87">25.0%</text>
    <text class="tick" x="-250" y="117">Hybrid + Haiku rerank</text>
    <rect class="rerank" x="0" y="100" width="286" height="22" rx="4"/>
    <text class="value" x="296" y="117">36.7%</text>

    <text class="sub" x="-250" y="184">Identifier controls</text>
    <text class="tick" x="-250" y="217">TF-IDF capped</text>
    <rect class="tfidf" x="0" y="200" width="302" height="22" rx="4"/>
    <text class="value" x="312" y="217">38.7%</text>
    <text class="tick" x="-250" y="247">TF-IDF uncapped</text>
    <rect class="accent" x="0" y="230" width="524" height="22" rx="4"/>
    <text class="value" x="534" y="247">67.2%</text>
    <text class="tick" x="-250" y="277">Literal lexical</text>
    <rect class="baseline" x="0" y="260" width="780" height="22" rx="4"/>
    <text class="value" x="790" y="277">100.0%</text>

    <text class="sub" x="-250" y="344">Lesson-primary queries</text>
    <text class="tick" x="-250" y="377">Before</text>
    <rect class="baseline" x="0" y="360" width="2" height="22" rx="4"/>
    <text class="value" x="12" y="377">0/10</text>
    <text class="tick" x="-250" y="407">After +515 primaries</text>
    <rect class="rerank" x="0" y="390" width="2" height="22" rx="4"/>
    <text class="value" x="12" y="407">0/10</text>

    <text class="sub" x="-250" y="474">Skills-gold queries</text>
    <text class="tick" x="-250" y="507">Before</text>
    <rect class="baseline" x="0" y="490" width="2" height="22" rx="4"/>
    <text class="value" x="12" y="507">0/19</text>
    <text class="tick" x="-250" y="537">After +50 SKILL.md files</text>
    <rect class="accent" x="0" y="520" width="493" height="22" rx="4"/>
    <text class="value" x="503" y="537">12/19 = 63.2%</text>

    <text class="sub" x="-250" y="604">Journal-gold queries</text>
    <text class="tick" x="-250" y="637">Baseline</text>
    <rect class="baseline" x="0" y="620" width="390" height="22" rx="4"/>
    <text class="value" x="400" y="637">4/8 = 50.0%</text>
    <text class="tick" x="-250" y="667">With recency prior</text>
    <rect class="accent" x="0" y="650" width="488" height="22" rx="4"/>
    <text class="value" x="498" y="667">5/8 = 62.5%</text>
  </g>

  <text class="note" x="70" y="795">Read the bars left to right: dense helped a bit, reranking helped more, uncapping TF-IDF helped a lot on identifiers,</text>
  <text class="note" x="70" y="823">lesson primaries stayed dead, and the skills/journal follow-up only became measurable once the gold set actually contained those surfaces.</text>
</svg>
