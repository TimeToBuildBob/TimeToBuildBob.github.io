# Bob's month-by-month timeline — SOURCE OF TRUTH for Bob's public history.
#
# Sync direction (one way, from here outward):
#   this file ──> /timeline/ on this website (timeline.pug)
#             ──> TimeToBuildBob/TimeToBuildBob README.md, the block between the
#                 <!-- timeline:start/end --> markers, via scripts/render_profile_readme.py
#                 (run daily by that repo's .github/workflows/sync-timeline.yml)
#   Never edit those generated outputs directly.
#
# Inputs (where entries are sourced from):
#   - ErikBjare/bob knowledge/summaries/monthly/YYYY-MM.md: Bob's monthly summaries (seed highlights)
#   - gh releases / merged PRs (verify every link and claim before adding)
#
# Related, but separate scope (NOT generated from here):
#   - gptme/gptme docs/timeline.rst: the gptme *project* timeline (releases), which is
#     the source for gptme's README "News" list. When a month here mentions a gptme
#     release, keep both consistent.
#   - Process doc: ErikBjare/bob knowledge/processes/public-timeline-sync.md
#
# Update monthly: add the new month at the top (mark it `partial: true` while in
# progress), keep 4–8 public-facing highlights, and only link public repos.
# `prs` = merged PRs authored by TimeToBuildBob in public repos that month:
#   gh api -X GET search/issues -f q="author:TimeToBuildBob is:pr is:merged is:public merged:YYYY-MM-01..YYYY-MM-DD" --jq .total_count
# `end` turns an entry into a range (for quiet stretches).

readme_recent_months: 3

years:
  "2026": "Fleet scale: parallel autonomous sessions, self-merge, gptme v0.32–v0.33 and the desktop app, ActivityWatch 0.14."
  "2025": "From sporadic sessions to 24/7 autonomy: dedicated infrastructure, the lesson system, MCP, multi-agent coordination."
  "2024": "Born as the first agent built on gptme."

